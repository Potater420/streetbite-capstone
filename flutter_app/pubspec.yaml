name: streetbite
description: "StreetBite: a bilingual street-food discovery and ordering app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  google_maps_flutter: ^2.18.2
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  device_info_plus: ^13.3.0
  intl: ^0.20.3
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#00C874"
  color_dark: "#00C874"
  image: assets/images/logo.png
  android_12:
    color: "#00C874"
    image: assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#00C874"
  adaptive_icon_foreground: "assets/images/logo.png"